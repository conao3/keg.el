name: Main workflow
on:
  push: {branches: [master]}
  pull_request: {branches: [master]}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: purcell/setup-emacs@v8.0
      with:
        version: '29.4'
    - run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
    - name: Run lint
      run: 'keg lint'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '24.5'
          - '25.3'
          - '26.3'
          - '27.2'
          - '28.2'
          - '29.4'
          - '30.2'
          - '31.1'
          - 'snapshot'
        include:
          - emacs_version: 'snapshot'
            allow_failure: true
          - emacs_version: '24.5'
            only_keg: true
          - emacs_version: '25.3'
            only_keg: true
    steps:
    - uses: actions/checkout@v7
    - uses: purcell/setup-emacs@v8.0
      with:
        version: ${{ matrix.emacs_version }}
    - run: echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

    - name: Run tests of keg
      if: matrix.allow_failure != true
      run: 'keg run test-all-keg'

    - name: Run tests of keg-mode
      if: matrix.allow_failure != true && matrix.only_keg != true
      run: 'keg run test-all-keg-mode'

    - name: Run tests of flycheck-keg
      if: matrix.allow_failure != true && matrix.only_keg != true
      run: 'keg run test-all-flycheck-keg'

    - name: Run tests (allow failure)
      if: matrix.allow_failure == true
      run: 'keg run test-all-keg || true'
